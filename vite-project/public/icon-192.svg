<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180733" />
      <stop offset="50%" stop-color="#0b0219" />
      <stop offset="100%" stop-color="#050010" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect width="186" height="186" x="3" y="3" rx="40" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.4" />

  <circle cx="96" cy="96" r="68" fill="none" stroke="url(#purpleGlow)" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="4 3" />

  <!-- Veena Resonator (Kudam) -->
  <circle cx="70" cy="120" r="28" fill="url(#gold)" opacity="0.95" />
  <circle cx="70" cy="120" r="21" fill="#180733" />
  <circle cx="70" cy="120" r="11" fill="url(#gold)" opacity="0.8" />

  <!-- Upper Resonator (Yali) -->
  <circle cx="128" cy="68" r="16" fill="url(#gold)" opacity="0.9" />
  <circle cx="128" cy="68" r="11" fill="#180733" />

  <!-- Veena Dandi -->
  <line x1="60" y1="130" x2="138" y2="54" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" />
  <line x1="63" y1="127" x2="141" y2="51" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Notes -->
  <circle cx="148" cy="42" r="3.5" fill="#fef08a" />
  <circle cx="48" cy="85" r="3" fill="#fef08a" opacity="0.8" />

  <text x="96" y="172" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="url(#gold)" text-anchor="middle" letter-spacing="2">SWARSETU</text>
</svg>
