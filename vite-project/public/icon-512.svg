<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180733" />
      <stop offset="50%" stop-color="#0b0219" />
      <stop offset="100%" stop-color="#050010" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Background decorative circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#purpleGlow)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Classical Indian Veena / Musical Emblem -->
  <!-- Veena Resonator (Kudam) -->
  <circle cx="190" cy="320" r="70" fill="url(#gold)" filter="url(#glow)" opacity="0.95" />
  <circle cx="190" cy="320" r="54" fill="#180733" />
  <circle cx="190" cy="320" r="28" fill="url(#gold)" opacity="0.8" />

  <!-- Upper Resonator (Yali / Gourd) -->
  <circle cx="340" cy="180" r="42" fill="url(#gold)" filter="url(#glow)" opacity="0.9" />
  <circle cx="340" cy="180" r="30" fill="#180733" />

  <!-- Veena Dandi (Neck / Fingerboard) -->
  <line x1="165" y1="345" x2="365" y2="145" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" />
  <line x1="172" y1="338" x2="372" y2="138" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />

  <!-- Musical Strings -->
  <line x1="155" y1="355" x2="355" y2="155" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
  <line x1="160" y1="350" x2="360" y2="150" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.9" />
  <line x1="175" y1="335" x2="375" y2="135" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.9" />

  <!-- Swara Notes / Sparks -->
  <path d="M 370 120 Q 380 90 405 100 Q 420 110 405 130 Z" fill="url(#purpleGlow)" />
  <circle cx="410" cy="100" r="6" fill="#fef08a" filter="url(#glow)" />
  <circle cx="120" cy="220" r="8" fill="#fef08a" opacity="0.75" />
  <circle cx="390" cy="340" r="10" fill="url(#gold)" opacity="0.6" />

  <!-- Platform Name Monogram -->
  <text x="256" y="445" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="url(#gold)" text-anchor="middle" letter-spacing="4">SWARSETU</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#c084fc" text-anchor="middle" letter-spacing="3">CONCERT ORCHESTRATION</text>
</svg>
